
name: Run uv Project on Dispatch

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: "File name or Stratus object key to process"
        required: true
        type: string

      wf_flow:
        description: "Workflow flow to execute"
        required: true
        type: choice
        options:
          - file_parser
          - social_media

permissions:
  contents: read

jobs:
  run-uv-task:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install FFmpeg
        if: ${{ github.event.inputs.wf_flow == 'file_parser' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Sync project dependencies
        run: uv sync --locked

      - name: Run command or script
        env:
          CATALYST_CLIENT_ID: ${{ secrets.CATALYST_CLIENT_ID }}
          CATALYST_CLIENT_SECRET: ${{ secrets.CATALYST_CLIENT_SECRET }}
          CATALYST_REFRESH_TOKEN: ${{ secrets.CATALYST_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run social-media-manager \
            --file-name "${{ github.event.inputs.file_name }}" --wf_flow "${{github.event.inputs.wf_flow}}"
